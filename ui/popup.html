<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>Bypass proxy (ru)</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="popup">
    <header>
      <h1>Bypass proxy (ru)</h1>
    </header>

    <section>
      <label class="row">
        <span>Расширение включено</span>
        <input type="checkbox" id="enabled" />
      </label>
      <label class="row">
        <span>Российские сайты без прокси</span>
        <input type="checkbox" id="geosite" />
      </label>
    </section>

    <section>
      <div class="row">
        <h2>Список geosite</h2>
        <button id="update">Обновить</button>
      </div>
      <div id="geo-bar" class="bar" hidden><div id="geo-bar-fill" class="bar-fill"></div></div>
      <p id="geo-status" class="muted">—</p>
      <label class="row">
        <span>Обновлять автоматически</span>
        <input type="checkbox" id="autoUpdate" />
      </label>
      <label class="row">
        <span>Период</span>
        <select id="interval">
          <option value="1">каждый день</option>
          <option value="7">раз в неделю</option>
          <option value="30">раз в месяц</option>
        </select>
      </label>
    </section>

    <section>
      <h2>Прокси</h2>
      <div class="proxy-grid">
        <label for="socks-host">Хост</label>
        <input type="text" id="socks-host" placeholder="127.0.0.1" spellcheck="false" />
        <label for="socks-port">Порт</label>
        <input type="text" id="socks-port" placeholder="1080" spellcheck="false" />
        <label for="socks-username">Логин</label>
        <input type="text" id="socks-username" spellcheck="false" />
        <label for="socks-password">Пароль</label>
        <input type="text" id="socks-password" spellcheck="false" />
        <label for="socks-proxydns">DNS через прокси</label>
        <input type="checkbox" id="socks-proxydns" />
      </div>
      <div class="row">
        <span id="socks-status" class="muted">—</span>
        <button id="socks-clear">Очистить</button>
      </div>
    </section>

    <section>
      <h2>Свои домены</h2>
      <div class="row">
        <input type="text" id="domain-input" placeholder="example.com" spellcheck="false" />
        <button id="domain-add">Добавить</button>
      </div>
      <p id="domains-status" class="muted">—</p>
      <ul id="domains"></ul>
    </section>

    <footer>
      <button id="open-options">Все настройки</button>
      <a id="geo-source" href="#" target="_blank" rel="noreferrer">источник</a>
    </footer>

    <script src="options.js"></script>
  </body>
</html>
